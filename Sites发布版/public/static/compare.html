<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山河有迹 · A/B 外观对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#172d27;font:15px/1.7 'Microsoft YaHei',sans-serif}header{padding:18px 28px;border-bottom:1px solid #ddcfb4;background:#fffdf8;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{margin:0;font:700 24px/1.5 SimSun,serif}p{margin:5px 0;font-size:13px;color:#786b53}nav{display:flex;gap:8px}button,a{font:inherit}button{background:#fffdf8;border:1px solid #cfbb98;padding:8px 22px;border-radius:5px;color:#172d27;cursor:pointer}button[aria-pressed=true]{background:#a72c28;color:white;border-color:#a72c28}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}section{min-width:0;border:1px solid #ddcfb4;border-radius:8px;overflow:hidden;background:#fffdf8}h2{font:700 20px/1.5 SimSun,serif;margin:0}section>div{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #ddcfb4}section a{color:#a72c28;font-size:13px;white-space:nowrap}iframe{width:100%;height:calc(100vh - 220px);min-height:620px;border:0;display:block;background:#fcf9f2}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}header{padding:16px}iframe{height:780px}nav{width:100%}button{flex:1;padding:8px}}
</style></head><body><header><div><h1>山河有迹 · 两种外观对比</h1><p>共用仓库原有功能与数据，只比较背景样式；每个页面可独立滚动和操作。</p></div><nav aria-label="选择对比板块"><button data-page="home" aria-pressed="true">首页</button><button data-page="people" aria-pressed="false">人物</button><button data-page="radar" aria-pressed="false">足迹</button></nav></header><main><section><div><span><h2>A · 横幅背景</h2><p>保持山水集中于页首，正文以纸白底为主。</p></span><a id="open-a" target="_blank" rel="noopener" href="/?appearance=a#/pages/home/index">单独打开 A ↗</a></div><iframe id="a" title="A版，横幅背景" src="/?appearance=a#/pages/home/index"></iframe></section><section><div><span><h2>B · 随页山水背景</h2><p>沿用同一张图，淡化至12%，随整个页面滚动。</p></span><a id="open-b" target="_blank" rel="noopener" href="/?appearance=b#/pages/home/index">单独打开 B ↗</a></div><iframe id="b" title="B版，随页背景" src="/?appearance=b#/pages/home/index"></iframe></section></main><script>
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));for(const version of ['a','b']){const url='/?appearance='+version+'#/pages/'+button.dataset.page+'/index';document.getElementById(version).src=url;document.getElementById('open-'+version).href=url}}));
</script></body></html>
